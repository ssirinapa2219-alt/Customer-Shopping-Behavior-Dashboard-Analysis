<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Shopping Dashboard</title>

    <link rel="stylesheet" href="style.css">

    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body>

    <div class="container">

        <h1>Customer Shopping Dashboard</h1>

        <!-- KPI Cards -->
        <div class="cards">

            <div class="card">
                <h3>Total Customers</h3>
                <p>10,000</p>
            </div>

            <div class="card">
                <h3>Total Revenue</h3>
                <p>₹5.2M</p>
            </div>

            <div class="card">
                <h3>Avg Purchase</h3>
                <p>₹520</p>
            </div>

            <div class="card">
                <h3>Categories</h3>
                <p>5</p>
            </div>

        </div>

        <!-- Charts -->
        <div class="charts">

            <div class="chart-box">
                <canvas id="genderChart"></canvas>
            </div>

            <div class="chart-box">
                <canvas id="categoryChart"></canvas>
            </div>

            <div class="chart-box">
                <canvas id="paymentChart"></canvas>
            </div>

            <div class="chart-box">
                <canvas id="ageChart"></canvas>
            </div>

        </div>

    </div>

    <!-- โหลด JavaScript ของเรา -->
    <script src="script.js"></script>

</body>
</html>
